version: "2"
sql:
  - engine: "postgresql"
    queries: "query.sql"
    schema: "schema.sql"
    gen:
      go:
        package: "pg"
        out: "pg"
        sql_package: "pgx/v5"
        overrides:
          # timestamptz (NOT NULL)
          - db_type: "timestamptz"
            go_type: "time.Time"
            nullable: false

          # timestamptz (NULL)
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          # uuid
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
            nullable: false
          - db_type: "uuid"
            go_type: "github.com/google/uuid.NullUUID"
            nullable: true

          # inet
          - db_type: "inet"
            go_type: "net/netip.Addr"
            nullable: false
          
          - column: "credentials.sign_count"
            go_type: "uint32"