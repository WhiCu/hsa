root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

env_files = [".env", "config/.env"]

[build]
  pre_cmd = []
  post_cmd = []
  cmd = "task build"
  entrypoint = ["./bin/main.exe"]
  full_bin = ""
  args_bin = []
  delay = 500
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules", "bin"]
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = false
  follow_symlink = false
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "env", "yaml", "yml", "toml"]
  include_file = []

  kill_delay = "500ms"
  send_interrupt = true

  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true